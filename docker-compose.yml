services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: passport
      POSTGRES_PASSWORD: passport_local_only
      POSTGRES_DB: passport
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passport -d passport"]
      interval: 3s
      retries: 20
volumes:
  pgdata:
